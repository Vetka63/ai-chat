spring:
  application:
    name: ai-chat-backend

server:
  port: 8080

app:
  chat:
    mode: ${CHAT_MODE:fallback}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-v4-flash}
    agent-profiles-pattern: ${AGENT_PROFILES_PATTERN:classpath*:agents/*.yml}
    default-agent-id: ${DEFAULT_AGENT_ID:general}
    log-payloads: ${LLM_LOG_PAYLOADS:false}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
