server:
  port: 8080

spring:
  application:
    name: java-mcp-games
  ai:
    mcp:
      server:
        name: java-games-catalog
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        annotation-scanner:
          enabled: true

games:
  api:
    base-url: ${GAMES_API_BASE_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health
