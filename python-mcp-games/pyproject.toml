[project]
name = "python-mcp-games"
version = "0.1.0"
description = "Independent Streamable HTTP MCP server for the Day 17 games catalog"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.2.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
