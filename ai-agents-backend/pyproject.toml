[project]
name = "ai-agents-backend"
version = "0.3.0"
description = "Python-агент с постоянным контекстом для задания Дня 8"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite==0.21.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
  "mistral-common[image,hf-hub]==1.11.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
