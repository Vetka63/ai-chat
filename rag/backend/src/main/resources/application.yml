server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: rag-index-lab
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
rag:
  corpus-path: ${RAG_CORPUS_PATH:../corpus/progit-ru}
  database-path: ${RAG_DATABASE_PATH:../data/rag.sqlite}
  ollama-url: ${OLLAMA_BASE_URL:http://localhost:11435}
  embedding-model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
  batch-size: ${EMBEDDING_BATCH_SIZE:8}
  embed-timeout-seconds: ${EMBED_TIMEOUT_SECONDS:180}
