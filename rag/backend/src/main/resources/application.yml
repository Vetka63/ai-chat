server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: rag-index-lab
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
rag:
  corpus-path: ${RAG_CORPUS_PATH:../corpus/progit-ru}
  database-path: ${RAG_DATABASE_PATH:../data/rag.sqlite}
  ollama-url: ${OLLAMA_BASE_URL:http://localhost:11435}
  embedding-model: ${EMBEDDING_MODEL:qwen3-embedding:0.6b}
  batch-size: ${EMBEDDING_BATCH_SIZE:8}
  embed-timeout-seconds: ${EMBED_TIMEOUT_SECONDS:180}
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:120}
  support-model: ${DEEPSEEK_SUPPORT_MODEL:deepseek-v4-pro}
  support-reasoning-effort: ${DEEPSEEK_SUPPORT_REASONING_EFFORT:high}
  support-timeout-seconds: ${DEEPSEEK_SUPPORT_TIMEOUT_SECONDS:180}
  preparation-model: ${DEEPSEEK_PREPARATION_MODEL:deepseek-v4-pro}
  preparation-reasoning-effort: ${DEEPSEEK_PREPARATION_REASONING_EFFORT:high}
  preparation-timeout-seconds: ${DEEPSEEK_PREPARATION_TIMEOUT_SECONDS:180}
