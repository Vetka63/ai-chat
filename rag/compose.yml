name: ai-chat-rag-day-21
services:
  ollama:
    image: ollama/ollama:0.35.1
    ports: ["127.0.0.1:${RAG_OLLAMA_PORT:-11435}:11434"]
    volumes: ["ollama-models:/root/.ollama"]
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    ports: ["127.0.0.1:${RAG_API_PORT:-8382}:8080"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBED_TIMEOUT_SECONDS: ${EMBED_TIMEOUT_SECONDS:-180}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      DEEPSEEK_SUPPORT_MODEL: ${DEEPSEEK_SUPPORT_MODEL:-deepseek-v4-pro}
      DEEPSEEK_SUPPORT_REASONING_EFFORT: ${DEEPSEEK_SUPPORT_REASONING_EFFORT:-high}
      DEEPSEEK_SUPPORT_THINKING_ENABLED: ${DEEPSEEK_SUPPORT_THINKING_ENABLED:-true}
      DEEPSEEK_SCOPE_THINKING_ENABLED: ${DEEPSEEK_SCOPE_THINKING_ENABLED:-false}
      DEEPSEEK_SUPPORT_TIMEOUT_SECONDS: ${DEEPSEEK_SUPPORT_TIMEOUT_SECONDS:-180}
      DEEPSEEK_GROUNDING_MODEL: ${DEEPSEEK_GROUNDING_MODEL:-deepseek-v4-pro}
      DEEPSEEK_GROUNDING_THINKING_ENABLED: ${DEEPSEEK_GROUNDING_THINKING_ENABLED:-true}
      DEEPSEEK_GROUNDING_REASONING_EFFORT: ${DEEPSEEK_GROUNDING_REASONING_EFFORT:-high}
      DEEPSEEK_GROUNDING_TIMEOUT_SECONDS: ${DEEPSEEK_GROUNDING_TIMEOUT_SECONDS:-180}
    volumes: ["rag-data:/app/data"]
    depends_on: [ollama]
    restart: unless-stopped
  client:
    build: {context: ., dockerfile: client/Dockerfile}
    ports: ["127.0.0.1:${RAG_UI_PORT:-8383}:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  rag-data:
  ollama-models:
