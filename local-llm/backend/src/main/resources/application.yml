spring:
  application:
    name: local-llm-lab
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: 8080
local-llm:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11436}
  models: ${LOCAL_LLM_MODELS:qwen3:8b}
  database-path: ${LOCAL_LLM_DATABASE_PATH:./data/lab.sqlite}
  timeout-seconds: 300
  context-size: 8192
rag:
  database-path: ${RAG_DATABASE_PATH:./data/rag.sqlite}
  embedding-model: ${RAG_EMBEDDING_MODEL:qwen3-embedding:0.6b}
  cloud-enabled: ${RAG_CLOUD_ENABLED:false}
  deepseek-api-key: ${DEEPSEEK_API_KEY:}
  deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  deepseek-models: ${RAG_DEEPSEEK_MODELS:deepseek-flash,deepseek-v4-pro}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
