name: ai-chat-local-llm
services:
  ollama:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
      LLAMA_ARG_CACHE_RAM: "0"
    ports: ["127.0.0.1:${LOCAL_LLM_OLLAMA_PORT:-11436}:11434"]
    volumes: ["local-models:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:${LOCAL_LLM_API_PORT:-8482}:8080"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_LLM_MODELS: ${OPT_LOCAL_MODEL:-qwen3:4b-q4_K_M}
      LOCAL_LLM_DATABASE_PATH: /app/data/lab.sqlite
      OPT_LOCAL_MODEL: ${OPT_LOCAL_MODEL:-qwen3:4b-q4_K_M}
      OPT_DATABASE_PATH: /app/data/optimization.sqlite
      OPT_CLOUD_ENABLED: ${OPT_CLOUD_ENABLED:-false}
      OPT_CLOUD_MODELS: ${OPT_CLOUD_MODELS:-deepseek-flash,deepseek-v4-pro}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
    volumes: ["local-data:/app/data"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
  client:
    build: { context: ., dockerfile: client/Dockerfile }
    ports: ["127.0.0.1:${LOCAL_LLM_UI_PORT:-8483}:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  local-models:
  local-data:
