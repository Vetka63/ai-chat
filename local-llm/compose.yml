name: ai-chat-local-llm
services:
  ollama:
    image: ollama/ollama:0.35.1
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_HOST: 0.0.0.0:11434
      # Embedding и completion не держим одновременно: меньше пиковая нагрузка CUDA/WSL.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # В Ollama 0.35.1 llama-server по умолчанию сохраняет до 8 GiB prompt snapshots в RAM.
      # Диалог хранит backend; этот runtime cache не нужен для корректности и опасен в WSL.
      LLAMA_ARG_CACHE_RAM: "0"
      OLLAMA_FLASH_ATTENTION: "1"
    ports: ["127.0.0.1:${LOCAL_LLM_OLLAMA_PORT:-11436}:11434"]
    volumes: ["local-models:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["127.0.0.1:${LOCAL_LLM_API_PORT:-8482}:8080"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_LLM_MODELS: ${LOCAL_LLM_MODELS:-qwen3:8b}
      LOCAL_LLM_DATABASE_PATH: /app/data/lab.sqlite
      RAG_DATABASE_PATH: /app/data/rag.sqlite
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      RAG_CLOUD_ENABLED: ${RAG_CLOUD_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      RAG_DEEPSEEK_MODELS: ${RAG_DEEPSEEK_MODELS:-deepseek-flash,deepseek-v4-pro}
    volumes: ["local-data:/app/data"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
  client:
    build: { context: ., dockerfile: client/Dockerfile }
    ports: ["127.0.0.1:${LOCAL_LLM_UI_PORT:-8483}:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  local-models:
  local-data:
