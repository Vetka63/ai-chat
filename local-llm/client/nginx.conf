server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 360s; }
    location /actuator/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
