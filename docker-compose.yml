services:
  backend:
    build:
      context: ./ai-chat-backend
    environment:
      CHAT_MODE: ${CHAT_MODE:-fallback}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_PRICE_INPUT_CACHE_MISS_PER_MILLION_USD: ${LLM_PRICE_INPUT_CACHE_MISS_PER_MILLION_USD:-0}
      LLM_PRICE_INPUT_CACHE_HIT_PER_MILLION_USD: ${LLM_PRICE_INPUT_CACHE_HIT_PER_MILLION_USD:-0}
      LLM_PRICE_OUTPUT_PER_MILLION_USD: ${LLM_PRICE_OUTPUT_PER_MILLION_USD:-0}
      DEFAULT_AGENT_ID: ${DEFAULT_AGENT_ID:-general}
      AGENT_PROFILES_PATTERN: ${AGENT_PROFILES_PATTERN:-classpath*:agents/*.yml}
      LLM_LOG_PAYLOADS: ${LLM_LOG_PAYLOADS:-false}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  client:
    build:
      context: ./ai-chat-client
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

  agents-backend:
    build:
      context: ./ai-agents-backend
    environment:
      PY_AGENT_MODE: ${PY_AGENT_MODE:-llm}
      PY_AGENT_API_KEY: ${PY_AGENT_API_KEY:-${LLM_API_KEY:-}}
      PY_AGENT_BASE_URL: ${PY_AGENT_BASE_URL:-${LLM_BASE_URL:-https://api.deepseek.com}}
      PY_AGENT_MODEL: ${PY_AGENT_MODEL:-${LLM_MODEL:-deepseek-v4-flash}}
      PY_AGENT_REQUEST_TIMEOUT_SECONDS: ${PY_AGENT_REQUEST_TIMEOUT_SECONDS:-90}
      PY_AGENT_CORS_ORIGINS: ${PY_AGENT_CORS_ORIGINS:-http://localhost:5174,http://localhost:8083}
      PY_AGENT_DATABASE_PATH: /app/data/agents.sqlite3
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      PY_AGENT_MISTRAL_TOKENIZER_PATH: /app/tokenizers/ministral-3b/tekken.json
      PY_AGENT_PYTHON_MCP_URL: http://python-mcp-games:8080/mcp
      PY_AGENT_JAVA_MCP_URL: http://java-mcp-games:8080/mcp
      PY_AGENT_GAME_FEED_MCP_URL: http://python-mcp-game-feed:8080/mcp
      PY_AGENT_GAME_REPORT_MCP_URL: http://python-mcp-game-reports:8080/mcp
      PY_AGENT_GO_REPORT_MCP_URL: http://go-mcp-report-store:8080/mcp
    depends_on:
      games-mock-api:
        condition: service_healthy
      python-mcp-games:
        condition: service_healthy
      java-mcp-games:
        condition: service_healthy
      python-mcp-game-feed:
        condition: service_healthy
      python-mcp-game-reports:
        condition: service_healthy
      go-mcp-report-store:
        condition: service_healthy
    volumes:
      - agents-data:/app/data
    ports:
      - "${PY_AGENTS_API_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 8s

  agents-client:
    build:
      context: ./ai-agents-client
    depends_on:
      agents-backend:
        condition: service_healthy
    ports:
      - "${PY_AGENTS_UI_PORT:-8083}:80"

  games-mock-api:
    build:
      context: ./mock-games-server
    environment:
      GAMES_DB_URL: jdbc:h2:file:/app/data/games;DB_CLOSE_ON_EXIT=FALSE
      GAMES_GENERATION_INTERVAL_MS: "30000"
    volumes:
      - mock-games-data:/app/data
    ports:
      - "${PY_GAMES_API_PORT:-8084}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  python-mcp-games:
    build:
      context: ./python-mcp-games
    environment:
      GAMES_API_BASE_URL: http://games-mock-api:8080
    depends_on:
      games-mock-api:
        condition: service_healthy
    ports:
      - "${PY_GAMES_MCP_PORT:-8086}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), timeout=2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  java-mcp-games:
    build:
      context: ./java-mcp-games
    environment:
      GAMES_API_BASE_URL: http://games-mock-api:8080
    depends_on:
      games-mock-api:
        condition: service_healthy
    ports:
      - "${JAVA_GAMES_MCP_PORT:-8085}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  python-mcp-game-feed:
    build:
      context: ./python-mcp-game-feed
    restart: unless-stopped
    environment:
      GAME_FEED_DB: /app/data/game-feed.sqlite3
    volumes:
      - game-feed-data:/app/data
    ports:
      - "127.0.0.1:${PY_GAME_FEED_MCP_PORT:-8087}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), timeout=2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  game-feed-worker:
    build:
      context: ./ai-agents-backend
    command: ["python", "-m", "agents.game_digest.scheduler"]
    environment:
      PY_AGENT_DATABASE_PATH: /app/data/agents.sqlite3
      PY_AGENT_GAME_FEED_MCP_URL: http://python-mcp-game-feed:8080/mcp
      PY_AGENT_JAVA_MCP_URL: http://java-mcp-games:8080/mcp
      GAME_DIGEST_POLL_SECONDS: "5"
    volumes:
      - agents-data:/app/data
    depends_on:
      agents-backend:
        condition: service_healthy
    restart: unless-stopped

  python-mcp-game-reports:
    build:
      context: ./python-mcp-game-reports
    environment:
      GAMES_API_BASE_URL: http://games-mock-api:8080
      GAME_REPORT_DIR: /app/data/reports
    volumes:
      - game-report-data:/app/data
    depends_on:
      games-mock-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PY_GAME_REPORT_MCP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), timeout=2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  go-mcp-report-store:
    build:
      context: ./go-mcp-report-store
    environment:
      REPORT_DIR: /app/data/reports
    volumes:
      - go-report-data:/app/data
    ports:
      - "127.0.0.1:${GO_REPORT_MCP_PORT:-8089}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  agents-data:
  game-feed-data:
  mock-games-data:
  game-report-data:
  go-report-data:
